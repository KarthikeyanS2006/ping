name: Capture Site Screenshots

on:
  schedule:
    # Runs every 5 hours (00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual runs from the GitHub Actions tab

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Capture Screenshots
        run: node capture.js

      - name: Commit and push screenshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add screenshots/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update site screenshots [skip ci]"
          git push
